[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ScreenShot"
version = "0.1.0"
description = "A simple package to take screenshots of the screen"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dawn"}]
dependencies = ["PILLOW", "PYside6"]

